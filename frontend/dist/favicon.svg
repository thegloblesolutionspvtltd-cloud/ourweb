<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Main Gradient -->
    <linearGradient id="eraBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2b66" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Arrow Core Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Metallic Highlight -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Main Outer e-loop -->
    <path d="M 230 110 
             C 140 110, 90 180, 90 270 
             C 90 360, 150 410, 240 410 
             C 310 410, 360 370, 385 320 
             L 320 320 
             C 305 345, 275 365, 240 365 
             C 180 365, 145 325, 145 270 
             C 145 250, 150 235, 160 220 
             Z" 
          fill="url(#eraBlueGrad)" />

    <!-- Inner 'e' crossbar and upper curve -->
    <path d="M 160 220 
             C 180 190, 215 165, 255 165 
             C 310 165, 345 195, 355 240 
             L 152 240 
             C 150 250, 150 260, 150 270 
             L 370 270 
             C 370 170, 315 110, 240 110 
             Z" 
          fill="url(#eraBlueGrad)" 
          opacity="0.9" />

    <!-- Dynamic Ascending Arrow Overlay cutting through -->
    <path d="M 105 380 
             C 160 340, 220 250, 310 160 
             L 280 160 
             L 395 105 
             L 355 220 
             L 330 185 
             C 240 270, 180 360, 125 410 
             Z" 
          fill="url(#arrowGrad)" 
          filter="url(#glow)" />

    <!-- Arrow Metallic Swoosh Edge -->
    <path d="M 115 390 
             C 170 340, 230 250, 320 160 
             L 395 105 
             L 345 130 
             C 270 200, 200 310, 115 390 Z" 
          fill="url(#shineGrad)" 
          opacity="0.5" />
  </g>
</svg>
